version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 100
    registries: "*"
    cooldown:
      default-days: 2
      semver-major-days: 7
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Blocked until eslint-plugin-react supports ESLint 10:
      # https://github.com/jsx-eslint/eslint-plugin-react/issues/3977
      # Upgrade eslint, @eslint/js and eslint-plugin-react together, then remove this.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@eslint/js"
        update-types:
          - "version-update:semver-major"
